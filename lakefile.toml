name = "HilbertPi"
version = "1.3.0"
keywords = ["math"]
defaultTargets = ["HilbertPi", "Test"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "HilbertPi"

# The axiom audit and numeric smoke tests; a default target so that `lake build`
# (and hence CI) enforces them.
[[lean_lib]]
name = "Test"
